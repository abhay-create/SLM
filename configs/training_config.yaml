# Training Configuration for 100M SLM — WritingPrompts Dataset

training:
  # Mode: 'curriculum' or 'direct'
  mode: curriculum

  # Training hyperparameters
  batch_size: 16           # Reduce to 8 if GPU OOM
  num_epochs: 10           # Total epochs
  learning_rate: 3.0e-4    # Peak learning rate
  weight_decay: 0.1        # AdamW weight decay
  gradient_clip: 1.0       # Gradient clipping value

  # Learning rate schedule
  warmup_steps: 500        # Number of warmup steps
  lr_decay: cosine         # cosine or linear
  min_lr_ratio: 0.1        # Minimum LR as ratio of peak LR

  # Logging and checkpointing
  eval_interval: 500       # Steps between evaluations
  save_interval: 500       # Steps between checkpoint saves (frequent!)
  log_interval: 100        # Steps between logging

  # Data
  seq_len: 512             # Sequence length for training
  num_workers: 2           # DataLoader workers

  # Device
  device: cuda             # cuda or cpu
  mixed_precision: true    # Use automatic mixed precision (AMP) - ENABLED
  compile: false           # Use torch.compile (requires PyTorch 2.0+)

curriculum:
  # Curriculum learning specific settings
  # Stage 1: Simple short texts
  # Stage 2: Mixed simple + complex
  # Stage 3: Complex long texts
  stage_epochs: [3, 4, 3]  # 10 epochs total

optimization:
  # Optimizer settings
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8

# Evaluation prompts for text generation
eval_prompts:
  - "Once upon a time"
  - "The hero stood at the edge"
  - "In a world where magic is real"
  - "She looked at the letter and"
  - "The city was silent when"