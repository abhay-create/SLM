# Stage 2 — FineWeb-Edu + SimpleWiki Replay
stage: 2
dataset: fineweb_edu
val_key: s2
seq_len: 512
max_tokens: 500_000_000
batch_size: 32
eval_interval: 500
patience: 8
min_delta: 0.01
spike_threshold: 10
spike_window: 20
learning_rate: 5e-5
lr_warmup_steps: 200
lr_min: 5e-6
weight_decay: 0.1
grad_clip: 1.0
# Replay buffer: 85% fineweb_edu + 15% simplewiki (replayed)
replay_ratio: 0.15
replay_from:
  - tinystories
